<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mukammal Kalkulyator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Ikonkalari -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .light .glass {
            background: rgba(255, 255, 255, 0.7);
        }
        /* Custom scrollbar for history */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 dark:bg-slate-950 dark:text-slate-100 light:bg-slate-100 light:text-slate-800 transition-colors duration-300 min-h-screen flex items-center justify-center p-3 md:p-6 font-sans">

    <!-- Asosiy Konteyner -->
    <div class="relative w-full max-w-4xl bg-slate-900/80 light:bg-white/80 border border-slate-800 light:border-slate-200 rounded-3xl shadow-2xl backdrop-blur-xl overflow-hidden flex flex-col md:flex-row min-h-[600px]">
        
        <!-- Kalkulyator Bo'limi -->
        <div class="flex-1 p-5 flex flex-col justify-between">
            
            <!-- Yuqori panel (Muvofiqlashtirish va Mode) -->
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
                    <span class="w-3 h-3 rounded-full bg-yellow-500 inline-block"></span>
                    <span class="w-3 h-3 rounded-full bg-green-500 inline-block"></span>
                    <span id="angle-mode" class="ml-3 text-xs font-semibold px-2 py-1 rounded bg-slate-800 light:bg-slate-200 text-emerald-400 cursor-pointer hover:opacity-80" onclick="toggleAngleMode()">DEG</span>
                </div>
                
                <div class="flex items-center gap-2">
                    <button onclick="toggleTheme()" class="p-2 rounded-xl bg-slate-800 light:bg-slate-100 hover:bg-slate-700 light:hover:bg-slate-200 text-slate-300 light:text-slate-700 transition">
                        <i id="theme-icon" class="fas fa-sun"></i>
                    </button>
                    <button onclick="toggleHistoryMobile()" class="md:hidden p-2 rounded-xl bg-slate-800 light:bg-slate-100 text-slate-300 light:text-slate-700">
                        <i class="fas fa-history"></i>
                    </button>
                </div>
            </div>

            <!-- Displey -->
            <div class="bg-slate-950/60 light:bg-slate-100/80 p-4 rounded-2xl mb-4 text-right border border-slate-800/80 light:border-slate-200 shadow-inner flex flex-col justify-end min-h-[110px]">
                <div id="prev-expression" class="text-slate-400 light:text-slate-500 text-sm font-mono h-6 overflow-hidden tracking-wider"></div>
                <input id="display" type="text" readonly class="w-full bg-transparent text-right text-3xl sm:text-4xl font-mono text-emerald-400 dark:text-emerald-400 light:text-emerald-600 focus:outline-none tracking-wider font-semibold" placeholder="0">
            </div>

            <!-- Ilmiy va Oddiy Tugmalar Katagi -->
            <div class="grid grid-cols-5 gap-2 sm:gap-2.5">
                
                <!-- 1-qator -->
                <button onclick="clearAll()" class="btn-action bg-red-500/20 text-red-400 hover:bg-red-500/30 font-bold p-3 rounded-xl transition active:scale-95">AC</button>
                <button onclick="deleteLast()" class="btn-action bg-amber-500/20 text-amber-400 hover:bg-amber-500/30 font-bold p-3 rounded-xl transition active:scale-95">DEL</button>
                <button onclick="appendOp('(')" class="btn-sci">( </button>
                <button onclick="appendOp(')')" class="btn-sci"> )</button>
                <button onclick="appendOp('/')" class="btn-op">÷</button>

                <!-- 2-qator -->
                <button onclick="appendFunc('sin')" class="btn-sci">sin</button>
                <button onclick="appendFunc('cos')" class="btn-sci">cos</button>
                <button onclick="appendFunc('tan')" class="btn-sci">tan</button>
                <button onclick="appendOp('^')" class="btn-sci">x&#x207F;</button>
                <button onclick="appendOp('*')" class="btn-op">×</button>

                <!-- 3-qator -->
                <button onclick="appendFunc('sqrt')" class="btn-sci">√</button>
                <button onclick="appendNum('7')" class="btn-num">7</button>
                <button onclick="appendNum('8')" class="btn-num">8</button>
                <button onclick="appendNum('9')" class="btn-num">9</button>
                <button onclick="appendOp('-')" class="btn-op">-</button>

                <!-- 4-qator -->
                <button onclick="appendFunc('log')" class="btn-sci">log</button>
                <button onclick="appendNum('4')" class="btn-num">4</button>
                <button onclick="appendNum('5')" class="btn-num">5</button>
                <button onclick="appendNum('6')" class="btn-num">6</button>
                <button onclick="appendOp('+')" class="btn-op">+</button>

                <!-- 5-qator -->
                <button onclick="appendFunc('ln')" class="btn-sci">ln</button>
                <button onclick="appendNum('1')" class="btn-num">1</button>
                <button onclick="appendNum('2')" class="btn-num">2</button>
                <button onclick="appendNum('3')" class="btn-num">3</button>
                <button onclick="calculate()" class="row-span-2 btn-equal bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold p-3 rounded-xl transition active:scale-95 flex items-center justify-center text-2xl shadow-lg shadow-emerald-500/20">=</button>

                <!-- 6-qator -->
                <button onclick="appendConst('π')" class="btn-sci">π</button>
                <button onclick="appendConst('e')" class="btn-sci">e</button>
                <button onclick="appendNum('0')" class="btn-num">0</button>
                <button onclick="appendNum('.')" class="btn-num">.</button>

            </div>
        </div>

        <!-- Tarix (History) Paneli -->
        <div id="history-panel" class="w-full md:w-72 bg-slate-950/40 light:bg-slate-50 border-t md:border-t-0 md:border-l border-slate-800 light:border-slate-200 p-4 flex flex-col justify-between hidden md:flex">
            <div>
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800 light:border-slate-200">
                    <h3 class="font-bold text-slate-300 light:text-slate-700 flex items-center gap-2">
                        <i class="fas fa-history text-emerald-400"></i> Hisoblashlar tarixi
                    </h3>
                    <button onclick="clearHistory()" class="text-xs text-slate-500 hover:text-red-400 transition">
                        <i class="fas fa-trash-alt"></i> Clean
                    </button>
                </div>
                <div id="history-list" class="space-y-3 max-h-[420px] overflow-y-auto pr-1">
                    <p id="empty-history" class="text-xs text-slate-500 text-center py-8">Tarix hozircha bo'sh</p>
                </div>
            </div>

            <div class="text-[10px] text-center text-slate-500 mt-4">
                Klaviatura qo'llab-quvvatlanadi (0-9, +, -, *, /, Enter, Backspace)
            </div>
        </div>

    </div>

    <!-- JavaScript Logikasi -->
    <script>
        const display = document.getElementById('display');
        const prevExpression = document.getElementById('prev-expression');
        const historyList = document.getElementById('history-list');
        const emptyHistory = document.getElementById('empty-history');
        const angleModeBtn = document.getElementById('angle-mode');
        
        let isRad = false;
        let history = [];

        // Style Class-larini bir xillashtirish
        document.querySelectorAll('.btn-num').forEach(b => {
            b.className = "bg-slate-800/80 light:bg-slate-200/80 hover:bg-slate-700 light:hover:bg-slate-300 text-white light:text-slate-800 font-semibold p-3 rounded-xl transition active:scale-95 text-lg shadow";
        });
        document.querySelectorAll('.btn-op').forEach(b => {
            b.className = "bg-indigo-600/80 hover:bg-indigo-500 text-white font-bold p-3 rounded-xl transition active:scale-95 text-xl shadow";
        });
        document.querySelectorAll('.btn-sci').forEach(b => {
            b.className = "bg-slate-800/40 light:bg-slate-100 hover:bg-slate-700/60 light:hover:bg-slate-200 text-emerald-400 light:text-emerald-600 font-medium p-2.5 rounded-xl transition active:scale-95 text-sm";
        });

        // Belgilarni kiritish
        function appendNum(num) {
            if (display.value === '0' && num !== '.') {
                display.value = num;
            } else {
                display.value += num;
            }
        }

        function appendOp(op) {
            if (display.value === '' && op !== '-') return;
            display.value += op;
        }

        function appendFunc(func) {
            display.value += func + '(';
        }

        function appendConst(c) {
            if (display.value === '0') display.value = c;
            else display.value += c;
        }

        function clearAll() {
            display.value = '';
            prevExpression.innerText = '';
        }

        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }

        function toggleAngleMode() {
            isRad = !isRad;
            angleModeBtn.innerText = isRad ? 'RAD' : 'DEG';
        }

        // Hisoblash Mantiqi
        function calculate() {
            let expr = display.value;
            if (!expr) return;

            try {
                prevExpression.innerText = expr + ' =';
                let parsed = expr
                    .replace(/π/g, 'Math.PI')
                    .replace(/e/g, 'Math.E')
                    .replace(/√\(/g, 'Math.sqrt(')
                    .replace(/log\(/g, 'Math.log10(')
                    .replace(/ln\(/g, 'Math.log(')
                    .replace(/\^/g, '**');

                // Trigonometriya DEG / RAD
                if (!isRad) {
                    parsed = parsed
                        .replace(/sin\(([^)]+)\)/g, 'Math.sin(($1) * Math.PI / 180)')
                        .replace(/cos\(([^)]+)\)/g, 'Math.cos(($1) * Math.PI / 180)')
                        .replace(/tan\(([^)]+)\)/g, 'Math.tan(($1) * Math.PI / 180)');
                } else {
                    parsed = parsed
                        .replace(/sin\(/g, 'Math.sin(')
                        .replace(/cos\(/g, 'Math.cos(')
                        .replace(/tan\(/g, 'Math.tan(');
                }

                let result = eval(parsed);
                
                // Natijani yaxlitlash (Floating point muammosi uchun)
                if (typeof result === 'number') {
                    result = Math.round(result * 1e10) / 1e10;
                }

                addHistory(expr, result);
                display.value = result;
            } catch (err) {
                display.value = 'Xatolik!';
                setTimeout(() => clearAll(), 1500);
            }
        }

        // Tarix funksiyalari
        function addHistory(expr, res) {
            if (emptyHistory) emptyHistory.remove();
            
            const item = document.createElement('div');
            item.className = "p-2 rounded-xl bg-slate-900/60 light:bg-white border border-slate-800 light:border-slate-200 cursor-pointer hover:border-emerald-500/50 transition text-right";
            item.innerHTML = `
                <div class="text-xs text-slate-400 font-mono">${expr}</div>
                <div class="text-sm font-bold text-emerald-400 font-mono">${res}</div>
            `;
            item.onclick = () => {
                display.value = res;
            };
            
            historyList.prepend(item);
        }

        function clearHistory() {
            historyList.innerHTML = '<p id="empty-history" class="text-xs text-slate-500 text-center py-8">Tarix hozircha bo\'sh</p>';
        }

        // Dark/Light Theme
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                icon.className = 'fas fa-moon';
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                icon.className = 'fas fa-sun';
            }
        }

        function toggleHistoryMobile() {
            const panel = document.getElementById('history-panel');
            panel.classList.toggle('hidden');
        }

        // Klaviatura integratsiyasi
        document.addEventListener('keydown', (e) => {
            if ((e.key >= '0' && e.key <= '9') || e.key === '.') appendNum(e.key);
            if (['+', '-', '*', '/', '(', ')'].includes(e.key)) appendOp(e.key);
            if (e.key === 'Enter') calculate();
            if (e.key === 'Backspace') deleteLast();
            if (e.key === 'Escape') clearAll();
        });
    </script>
</body>
</html>
